laceholder-val="{{ false }}"><span id="emaile" style="font-size: 13px; line-height: 1.45; color: #A3231A">Use o e-mail completo, por exemplo voce@empresa.com.br.</span></sc-if></div><div style="display: flex; flex-direction: column; gap: 8px; padding-top: 4px"><button type="button" class="j-btn" disabled="{{ enviando }}" aria-busy="{{ enviando }}" onClick="{{ enviar }}" style="display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 52px; padding: 0 24px; border: none; border-radius: 999px; background: #0E1120; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer"><sc-if value="{{ enviando }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" class="j-spin" style="width: 16px; height: 16px; box-sizing: border-box; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.35); border-top-color: #FFFFFF"></span></sc-if>{{ botaoTexto }}</button><div style="display: flex; justify-content: center"><a href="/entrar" class="j-btn j-btn--link" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0; box-sizing: border-box; border-radius: 999px; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer; white-space: nowrap; text-decoration-skip-ink: auto"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 5.5 8 11l5.5 5.5"></path></svg>Voltar para entrar</a></div></div></div></div></sc-if><sc-if value="{{ enviado }}" hint-placeholder-val="{{ false }}"><div class="j-in" style="display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center"><span aria-hidden="true" class="j-pop" style="display: flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 50%; background: #EEF1FC; color: #1E2A6E"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h7l4 4v12H6z"></path><path d="M13 3v4h4"></path></svg></span><div style="display: flex; flex-direction: column; gap: 10px"><h1 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-size: 48px; line-height: 1.05; font-weight: 400; letter-spacing: -0.01em">Confira seu e-mail</h1><p role="status" style="margin: 0; font-size: 15px; line-height: 1.5; color: #5E6372">Se <strong style="color: #0E1120">{{ emailTexto }}</strong> tiver uma conta na gincana, o link chega em alguns minutos e vale por 1 hora.</p></div><div style="display: flex; flex-direction: column; gap: 8px; width: 100%"><a href="/entrar" class="j-btn j-btn--primary" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 24px; box-sizing: border-box; border-radius: 999px; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer; white-space: nowrap; text-decoration-skip-ink: auto; width: 100%; text-decoration: none">Voltar para entrar</a><button type="button" class="j-btn j-btn--link" onClick="{{ outro }}" style="align-self: center; min-height: 44px; padding: 0; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer">Usar outro e-mail</button></div><p style="margin: 0; font-size: 13px; line-height: 1.45; color: #5E6372">Não chegou? Olhe a caixa de spam ou peça ajuda à administradora.</p></div></sc-if></div><p style="margin: 0; max-width: 420px; text-align: center; font-size: 13px; line-height: 1.45; color: #5E6372">Por segurança, a mensagem é a mesma exista ou não uma conta com esse e-mail.</p></div><div style="position: relative; min-height: 100vh; overflow: hidden; background: #0E2111"><img src="/assets/trofeu-mesa.jpg" alt="Troféu da Gincana Solidária: duas figuras erguendo um coração com a marca da Cestacorp, sobre uma mesa de madeira" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; display: block"></div></div>

<script type="text/x-dc-logic" id="dc-logic">class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const email = st.email != null ? st.email : '';
const fase = st.fase || 'editando';
const valido = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim());
const mostrarErro = !!st.tentou && !valido;
const enviando = fase === 'enviando';
return {
email: email,
digitar: (e) => this.setState({ email: e.target.value }),
mostrarErro: mostrarErro,
enviando: enviando,
enviar: () => { if (!valido) { this.setState({ tentou: true }); return; } this.setState({ fase: 'enviando' }); setTimeout(() => this.setState({ fase: 'enviado' }), 800); },
botaoTexto: enviando ? 'Enviando…' : 'Enviar link',
editando: fase !== 'enviado',
enviado: fase === 'enviado',
emailTexto: email.trim() || 'seu e-mail',
outro: () => this.setState({ fase: 'editando', tentou: false })
};
}
}
</script>
