: 500; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; font-size: 20px; color: #5E6372; text-decoration: line-through; text-decoration-color: #D3D6DE">10</td><td style="padding: 14px 16px; text-align: right; line-height: 1.2; font-weight: 500; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; font-size: 20px">8</td><td style="padding: 14px 0 14px 16px; font-size: 13px; line-height: 1.45; color: #5E6372">10 px e 6 px saíram. Ficou 2 · 8 · 12 · 16 · 20 · 24 · pílula · círculo.</td></tr><tr style="border-top: 1px solid #E6E8EE"><td style="padding: 14px 16px 14px 0; font-size: 15px; line-height: 1.5; font-weight: 600">Espaços entre itens</td><td style="padding: 14px 16px; text-align: right; line-height: 1.2; font-weight: 500; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; font-size: 20px; color: #5E6372; text-decoration: line-through; text-decoration-color: #D3D6DE">13</td><td style="padding: 14px 16px; text-align: right; line-height: 1.2; font-weight: 500; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; font-size: 20px">10</td><td style="padding: 14px 0 14px 16px; font-size: 13px; line-height: 1.45; color: #5E6372">3, 14 e 28 px foram para 4, 16 e 24.</td></tr><tr style="border-top: 1px solid #E6E8EE"><td style="padding: 14px 16px 14px 0; font-size: 15px; line-height: 1.5; font-weight: 600">Alturas de linha</td><td style="padding: 14px 16px; text-align: right; line-height: 1.2; font-weight: 500; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; font-size: 20px; color: #5E6372; text-decoration: line-through; text-decoration-color: #D3D6DE">8</td><td style="padding: 14px 16px; text-align: right; line-height: 1.2; font-weight: 500; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; font-size: 20px">6</td><td style="padding: 14px 0 14px 16px; font-size: 13px; line-height: 1.45; color: #5E6372">1,55 e 1,15 juntaram com 1,5 e 1,2.</td></tr><tr style="border-top: 1px solid #E6E8EE"><td style="padding: 14p -height: 1.45; color: #5E6372">Recusar e desativar passaram a usar Botão destrutivo.</td></tr><tr style="border-top: 1px solid #E6E8EE"><td style="padding: 14px 16px 14px 0; font-size: 15px; line-height: 1.5; font-weight: 600">Chips</td><td style="padding: 14px 16px; text-align: right; line-height: 1.2; font-weight: 500; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; font-size: 20px; color: #5E6372; text-decoration: line-through; text-decoration-color: #D3D6DE">2 implementações</td><td style="padding: 14px 16px; text-align: right; line-height: 1.2; font-weight: 500; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; font-size: 20px">1</td><td style="padding: 14px 0 14px 16px; font-size: 13px; line-height: 1.45; color: #5E6372">Os motivos de recusa no celular usam o Chip do sistema.</td></tr></tbody></table></div><p style="margin: 0; font-size: 13px; line-height: 1.45; color: #5E6372">Inventário feito nas 28 telas da Direção J. As cores já eram poucas: das 41 que existem, 39 agora vêm de um primitivo e 2 são do degradê da foto do login. O passo de normalização roda em todo build, então uma tela nova não volta a ter valor solto.</p></section><section style="display: flex; flex-direction: column; gap: 32px; padding: 64px 0; border-top: 1px solid #E6E8EE"><header style="display: flex; flex-direction: column; gap: 8px; max-width: 720px"><span style="font-family: 'Geist Mono', ui-monospace, SFMono-Regular, monospace; font-size: 12px; line-height: 1.2; letter-spacing: 0.06em; text-transform: uppercase; color: #5E6372">01 · Arquitetura</span><h2 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-size: 40px; line-height: 1.05; font-weight: 400; letter-spacing: -0.01em">Três camadas de token</h2><p style="margin: 0; font-size: 17px; line-height: 1.5; color: #5E6372">Uma decisão de cor mora num lugar só. O protótipo, o CSS e o Tailwind saem do mesmo arquivo.</p></header><div style="display: flex; align-items: stretch; gap: 12px"><di
