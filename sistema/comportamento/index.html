rentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 9 11 13.5 15.5 9"></path></svg></span></span><span style="display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid #BFE0A8; background: #EEF7E6; color: #2F6A12; font-size: 13px; line-height: 1.45; font-weight: 600; white-space: nowrap">Enviado</span><span style="display: inline-flex; flex-direction: column; align-items: center; gap: 2px; padding: 0 4px"><span style="font-family: 'Geist Mono', ui-monospace, SFMono-Regular, monospace; font-size: 12px; line-height: 1.2; letter-spacing: 0.01em; text-transform: none; color: #5E6372; white-space: nowrap">Registrar outra</span><span aria-hidden="true" style="display: flex; align-items: center; color: #D3D6DE"><span style="width: 48px; height: 1px; background: #D3D6DE"></span><svg aria-hidden="true" width="12" height="12" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 9 11 13.5 15.5 9"></path></svg></span></span><span style="display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid #0E1120; background: #0E1120; color: #FFFFFF; font-size: 13px; line-height: 1.45; font-weight: 600; white-space: nowrap">Editando</span><span style="width: 100%"></span><span style="display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid #D3D6DE; background: #F1F2F5; color: #0E1120; font-size: 13px; line-height: 1.45; font-weight: 600; white-space: nowrap">Enviando</span><span style="display: inline-flex; flex-direction: column; align-items: center; gap: 2px; padding: 0 4px"><span style="font-family: 'Geist Mono', ui-monospace, SFMono-Regular, monospace; font-size: 12px; line-height: 1.2; letter-spacing: 0.01em; text-transform: none; color: #5E6372; white-space: nowrap">falha de rede</span><span aria-hidden= adding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; line-height: 1.45"><li>Botão “Registrar ação” no início, sempre no polegar.</li><li>Volta preenchido com a última ação usada.</li></ul></div><div style="display: flex; flex-direction: column; gap: 8px; min-width: 0"><span style="font-family: 'Geist Mono', ui-monospace, SFMono-Regular, monospace; font-size: 12px; line-height: 1.2; letter-spacing: 0.06em; text-transform: uppercase; color: #5E6372">Regras</span><ul style="margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; line-height: 1.45"><li>Foto obrigatória: sem ela o envio fica bloqueado e o aviso diz o motivo.</li><li>Quantidade aceita vírgula ou ponto; zero ou vazio bloqueia.</li><li>Pontuação fixa esconde o campo de quantidade.</li></ul></div><div style="display: flex; flex-direction: column; gap: 8px; min-width: 0"><span style="font-family: 'Geist Mono', ui-monospace, SFMono-Regular, monospace; font-size: 12px; line-height: 1.2; letter-spacing: 0.06em; text-transform: uppercase; color: #5E6372">Feedback</span><ul style="margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; line-height: 1.45"><li>Pontos calculados ao vivo no rodapé, a cada toque em − / +.</li><li>Enviando: botão com indicador e texto “Enviando…”.</li><li>Enviado: tela própria com “45 pontos a caminho”, as etapas e o efeito no placar.</li></ul></div><div style="display: flex; flex-direction: column; gap: 8px; min-width: 0"><span style="font-family: 'Geist Mono', ui-monospace, SFMono-Regular, monospace; font-size: 12px; line-height: 1.2; letter-spacing: 0.06em; text-transform: uppercase; color: #5E6372">Repetição</span><ul style="margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; line-height: 1.45"><li>“Registrar outra ação” limpa a foto e mantém o fluxo aberto.</li><li>Se a rede cair: o envio fica guardado e tenta de novo sozinho
