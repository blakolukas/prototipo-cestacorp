const st = this.state || {};
const filtro = st.filtro || 'todas';
const fmt = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const acoes = [
{ id: 'tampinhas', nome: 'Tampinhas', longo: 'em tampinhas' },
{ id: 'roupa', nome: 'Roupa infantil', longo: 'em roupa infantil' },
{ id: 'extra', nome: 'Atividade extra', longo: 'em atividade extra' }
];
const base = [
{ nome: 'Equipe Azul', curto: 'Azul', lider: 'Camila Duarte', pend: 2, cor: '#2563EB', pts: { tampinhas: 620, roupa: 720, extra: 50 }, hoje: { tampinhas: 30, roupa: 0, extra: 0 }, curva: [0.30, 0.42, 0.55, 0.66, 0.78, 0.90, 1] },
{ nome: 'Equipe Laranja', curto: 'Laranja', lider: 'Paula Mendes', pend: 1, cor: '#D97706', pts: { tampinhas: 550, roupa: 660, extra: 50 }, hoje: { tampinhas: 0, roupa: 90, extra: 0 }, curva: [0.18, 0.26, 0.38, 0.52, 0.70, 0.86, 1] },
{ nome: 'Equipe Turquesa', curto: 'Turquesa', lider: 'Bruno Farias', pend: 3, cor: '#0D9488', pts: { tampinhas: 410, roupa: 570, extra: 0 }, hoje: { tampinhas: 45, roupa: 0, extra: 0 }, curva: [0.40, 0.48, 0.60, 0.68, 0.80, 0.92, 1] },
{ nome: 'Equipe Vinho', curto: 'Vinho', lider: 'Letícia Prado', pend: 0, cor: '#9D174D', pts: { tampinhas: 260, roupa: 450, extra: 50 }, hoje: { tampinhas: 0, roupa: 0, extra: 0 }, curva: [0.62, 0.70, 0.78, 0.86, 0.93, 0.98, 1] }
];
const zero = { tampinhas: 0, roupa: 0, extra: 0 };
const equipes = ZERADO ? base.map((e) => Object.assign({}, e, { pts: zero, hoje: zero })) : base;
const recentes = ZERADO ? [] : [
{ ini: 'RL', bg: '#DBEAFE', fg: '#1E40AF', nome: 'Rafael Lima', acao: 'tampinhas', txt: 'Tampinhas · 3 kg', pts: '+30', quando: '14:40' },
{ ini: 'DA', bg: '#FEF3C7', fg: '#92400E', nome: 'Diego Alves', acao: 'roupa', txt: 'Roupa infantil · 6 peças', pts: '+90', quando: '13:12' },
{ ini: 'MS', bg: '#CCFBF1', fg: '#115E59', nome: 'Marina Souza', acao: 'tampinhas', txt: 'Tampinhas · 4,5 kg', pts: '+45', quando: '11:58' },
{ ini: 'LP', bg: '#FCE7F3', fg: '#9D174D', nome: 'Letícia Prado', acao: 'extra', txt: 'Atividade extra', pts: '+50', quando: 'ontem' },
{ ini: 'BF', bg: '#CCFBF1', fg: '#115E59', nome: 'Bruno Farias', acao: 'roupa', txt: 'Roupa infantil · 3 peças', pts: '+45', quando: 'ontem' },
{ ini: 'PM', bg: '#FEF3C7', fg: '#92400E', nome: 'Paula Mendes', acao: 'tampinhas', txt: 'Tampinhas · 2 kg', pts: '+20', quando: 'ontem' },
{ ini: 'CN', bg: '#DBEAFE', fg: '#1E40AF', nome: 'Carla Nunes', acao: 'extra', txt: 'Atividade extra', pts: '+50', quando: 'ontem' }
];
const soma = (o) => filtro === 'todas' ? o.tampinhas + o.roupa + o.extra : o[filtro];
const valor = (e) => soma(e.pts);
const ord = equipes.slice().sort((a, b) => valor(b) - valor(a) || a.curto.localeCompare(b.curto));
const lider = valor(ord[0]);
const max = Math.max(1, lider);
const total = ord.reduce((s, e) => s + valor(e), 0);
const hojeTotal = ord.reduce((s, e) => s + soma(e.hoje), 0);
const atual = acoes.find((x) => x.id === filtro);
const sufixo = atual ? ' ' + atual.longo : '';
let titulo = ord[0].curto + ' lidera' + sufixo + ' por ' + fmt(lider - valor(ord[1])) + ' pontos';
if (lider === 0) {
titulo = atual ? 'Ainda não há pontos ' + atual.longo : 'A gincana começou. Nenhum ponto aprovado ainda';
} else if (lider === valor(ord[1])) {
const n = ord.filter((e) => valor(e) === lider).length;
titulo = 'Empate' + sufixo + ': ' + n + ' equipes com ' + fmt(lider) + ' pontos';
}
const W = 96, H = 28;
const linha = (e) => valor(e) === 0 ? '' : e.curva.map((c, k) => (Math.round(k * (W / 6) * 10) / 10) + ',' + (Math.round((H - 2 - (c * valor(e) / max) * (H - 4)) * 10) / 10)).join(' ');
const rec = recentes.filter((r) => filtro === 'todas' || r.acao === filtro).slice(0, 4);
return {
menuAberto: !!st.menu,
alternarMenu: () => this.setState({ menu: !st.menu }),
titulo: titulo,
total: fmt(total),
hoje: hojeTotal > 0 ? '+' + fmt(hojeTotal) + ' hoje' : 'nada novo hoje',
hojeBg: hojeTotal > 0 ? '#EEF7E6' : '#F1F2F5',
hojeCor: hojeTotal > 0 ? '#2F6A12' : '#5E6372',
filtroNome: atual ? atual.nome.toLowerCase() : 'todas as ações',
filtros: [{ id: 'todas', nome: 'Todas' }].concat(acoes).map((f) => {
const ativo = f.id === filtro;
return { nome: f.nome, ativo: ativo, bg: ativo ? '#0E1120' : '#FFFFFF', borda: ativo ? '#0E1120' : '#D3D6DE', cor: ativo ? '#FFFFFF' : '#0E1120', pick: () => this.setState({ filtro: f.id }) };
}),
linhas: ord.map((e, idx) => {
const pos = 1 + ord.filter((x) => valor(x) > valor(e)).length;
const gap = lider - valor(e);
const h = soma(e.hoje);
return {
nome: e.nome, cor: e.cor,
sub: e.curto === 'Turquesa' ? 'Sua equipe · líder ' + e.lider : 'Líder ' + e.lider,
fundo: e.curto === 'Turquesa' ? '#EEF7E6' : 'transparent',
pos: lider === 0 ? '—' : '0' + pos,
pct: (Math.round(valor(e) / max * 1000) / 10) + '%',
opac: pos === 1 ? '1' : '0.45',
pts: fmt(valor(e)),
dist: lider === 0 ? 'sem pontos ainda' : (gap === 0 ? 'na liderança' : 'a ' + fmt(gap) + ' do 1º'),
distCor: lider > 0 && gap === 0 ? '#2F6A12' : '#5E6372',
hoje: h > 0 ? '+' + h + ' hoje' : '',
spark: linha(e),
borda: (idx === 0 || e.curto === 'Turquesa' || (ord[idx - 1] && ord[idx - 1].curto === 'Turquesa')) ? 'transparent' : '#E6E8EE'
};
}),
fatias: total > 0 ? ord.map((e) => ({
cor: e.cor,
pct: (Math.round(valor(e) / total * 1000) / 10) + '%',
legenda: e.curto + ' ' + Math.round(valor(e) / total * 100) + '%'
})) : [{ cor: '#E6E8EE', pct: '100%', legenda: 'Sem pontos para dividir' }],
recentes: rec,
temRecentes: rec.length > 0,
semRecentes: rec.length === 0,
semRecentesTexto: ZERADO ? 'Quando a primeira ação for aprovada, ela aparece aqui.' : 'Nenhuma aprovação recente' + (atual ? ' ' + atual.longo : '') + '.'
};
}
}
</script>
