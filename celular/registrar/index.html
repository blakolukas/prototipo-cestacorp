e="button" class="j-btn" disabled="{{ bloqueado }}" aria-busy="{{ enviando }}" onClick="{{ enviar }}" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 52px; border-radius: 999px; border: none; background: {{ enviarBg }}; color: {{ enviarCor }}; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer"><sc-if value="{{ enviando }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" class="j-spin" style="width: 16px; height: 16px; box-sizing: border-box; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.35); border-top-color: #FFFFFF"></span></sc-if>{{ enviarTexto }}</button><div style="font-size: 13px; line-height: 1.45; color: #5E6372; text-align: center">{{ avisoTexto }}</div></footer></div></sc-if><sc-if value="{{ enviado }}" hint-placeholder-val="{{ false }}"><div class="j-in" style="height: 844px; box-sizing: border-box; padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 24px"><div style="flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; gap: 24px"><div style="display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center"><span aria-hidden="true" class="j-pop" style="display: flex; align-items: center; justify-content: center; width: 72px; height: 72px; border-radius: 50%; background: #EEF7E6; color: #2F6A12"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 11.5 9.5 15.5 16.5 7.5"></path></svg></span><h1 role="status" style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-size: 48px; line-height: 1.05; font-weight: 400; letter-spacing: -0.01em">{{ pontosTexto }} a caminho</h1><p style="margin: 0; font-size: 15px; line-height: 1.5; color: #5E6372">{{ resumo }}</p></div><section style="border-radius: 20px; border: 1px solid #E6E8EE; background: #FFFFFF; padding: 8px 16px"><ol aria-label="Andamento" style="list-style: none; margin: 0; padding: 0"><li style="display: flex; align-items: center; gap: 12px; min-height: 44px"><span aria-hidden="true" style="display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; flex: none; background: #2F6A12; color: #FFFFFF"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 11.5 9.5 15.5 16.5 7.5"></path></svg></span><span style="flex: 1 1 auto; font-size: 15px; line-height: 1.5">Foto e quantidade enviadas</span><span style="font-family: 'Geist Mono', ui-monospace, SFMono-Regular, monospace; font-size: 12px; line-height: 1.2; letter-spacing: 0.01em; text-transform: none; color: #5E6372">agora</span></li><li style="display: flex; align-items: center; gap: 12px; min-height: 44px; border-top: 1px solid #E6E8EE"><span aria-hidden="true" style="display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; flex: none; border: 2px solid #0E1120"></span><span style="flex: 1 1 auto; font-size: 15px; line-height: 1.5; font-weight: 600">Bruno Farias confere a foto</span></li><li style="display: flex; align-items: center; gap: 12px; min-height: 44px; border-top: 1px solid #E6E8EE"><span aria-hidden="true" style="display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; flex: none; border: 2px dashed #D3D6DE"></span><span style="flex: 1 1 auto; font-size: 15px; line-height: 1.5; color: #5E6372">Pontos entram no placar</span></li></ol></section><div style="display: flex; flex-direction: column; gap: 4px; padding: 16px; border-radius: 12px; background: #F7F8FA"><span style="font-family: 'Geist Mono', ui-monospace, SFMono-Regular, monospace; font-size: 12px; line-height: 1.2; letter-spacing: 0.06em; text-transform: uppercase; color: #5E6372">Quando aprovar</span><span style="font-size: 15px; line-height: 1.5; font-weight: 600">{{ impacto }}</span></div></div><div style="display: flex; flex-direction: column; gap: 8px"><button type="button" class="j-btn j-btn--primary" onClick="{{ outra }}" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 24px; box-sizing: border-box; border-radius: 999px; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer; white-space: nowrap; text-decoration-skip-ink: auto; width: 100%; text-decoration: none"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5v12"></path><path d="M5 11h12"></path></svg>Registrar outra ação</button><a href="/celular/inicio" class="j-btn j-btn--secondary" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 24px; box-sizing: border-box; border-radius: 999px; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer; white-space: nowrap; text-decoration-skip-ink: auto; width: 100%; text-decoration: none">Voltar ao início</a></div></div></sc-if></div>

<script type="text/x-dc-logic" id="dc-logic">class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const regras = [
{ id: 'tampinhas', nome: 'Tampinhas plásticas', regra: '10 pts por kg', pts: 10, passo: 0.5, min: 0.5, um: 'kg', varios: 'kg', inicial: 4.5, fixa: false },
{ id: 'infantil', nome: 'Roupa infantil', regra: '15 pts por peça', pts: 15, passo: 1, min: 1, um: 'peça', varios: 'peças', inicial: 1, fixa: false },
{ id: 'extra', nome: 'Atividade extra (exemplo)', regra: '50 pts fixos', pts: 50, passo: 1, min: 1, um: 'participação', varios: 'participações', inicial: 1, fixa: true }
];
const fmt = (n) => String(Math.round(n * 10) / 10).replace('.', ',');
const id = st.item || 'tampinhas';
const atual = regras.find((r) => r.id === id) || regras[0];
const txt = st.qtdTxt != null ? st.qtdTxt : fmt(atual.inicial);
const num = parseFloat(String(txt).replace(',', '.'));
const valido = atual.fixa || (isFinite(num) && num > 0);
const qtd = atual.fixa ? 1 : (valido ? num : 0);
const foto = !!st.foto;
const fase = st.fase || 'editando';
const enviando = fase === 'enviando';
const enviado = fase === 'enviado';
const pontos = Math.round(qtd * atual.pts);
const unidade = qtd === 1 ? atual.um : atual.varios;
const bloqueado = !foto || enviando || !valido;
const base = valido ? qtd : atual.min;
let aviso = 'Os pontos entram no placar depois da aprovação.';
if (enviando) { aviso = 'Enviando a foto…'; }
else if (!valido) { aviso = 'Informe uma quantidade maior que zero.'; }
else if (!foto) { aviso = 'Anexe a foto para poder enviar.'; }
return {
items: regras.map((r) => {
const sel = r.id === id;
return { nome: r.nome, regra: r.regra, selected: sel, ring: sel ? '#0E1120' : '#8A8F9C', dot: sel ? '#0E1120' : 'transparent', bg: sel ? '#F1F2F5' : 'transparent', sombra: 'none', pick: () => this.setState({ item: r.id, qtdTxt: fmt(r.inicial) }) };
}),
mostraQtd: !atual.fixa,
qtdTxt: txt,
unidade: unidade,
digitar: (e) => this.setState({ qtdTxt: e.target.value }),
menos: () => this.setState({ qtdTxt: fmt(Math.max(atual.min, base - atual.passo)) }),
mais: () => this.setState({ qtdTxt: fmt(base + atual.passo) }),
semFoto: !foto,
comFoto: foto,
anexarFoto: () => this.setState({ foto: !foto }),
pontosTexto: pontos + (pontos === 1 ? ' ponto' : ' pontos'),
contaTexto: atual.fixa ? 'pontuação fixa' : (valido ? fmt(qtd) + ' ' + unidade + ' × ' + atual.pts + ' pts' : ''),
bloqueado: bloqueado,
enviar: () => { this.setState({ fase: 'enviando' }); setTimeout(() => this.setState({ fase: 'enviado' }), 900); },
editando: !enviado,
enviado: enviado,
enviando: enviando,
outra: () => this.setState({ fase: 'editando', foto: false, item: 'tampinhas', qtdTxt: null }),
resumo: atual.nome.replace(' (exemplo)', '') + (atual.fixa ? '' : ' · ' + fmt(qtd) + ' ' + unidade) + ' · Equipe Turquesa',
impacto: (1260 - 980 - pontos) > 0 ? 'A Turquesa fica a ' + (1260 - 980 - pontos) + ' pontos da Laranja.' : 'A Turquesa passa a Laranja e sobe para o 2º lugar.',
enviarBg: (bloqueado && !enviando) ? '#F1F2F5' : '#0E1120',
enviarCor: (bloqueado && !enviando) ? '#5E6372' : '#FFFFFF',
enviarSombra: 'none',
enviarTexto: enviando ? 'Enviando…' : 'Enviar para aprovação',
avisoTexto: aviso
};
}
}
</script>
