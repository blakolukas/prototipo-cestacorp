<style>:root{--color-text-default:#0E1120;--color-text-muted:#5E6372;--color-text-inverse:#FFFFFF;--color-text-link:#2736A6;--color-text-link-hover:#1E2A6E;--color-text-brand:#1E2A6E;--color-text-success:#2F6A12;--color-text-warning:#7A4E00;--color-text-danger:#A3231A;--color-text-danger-strong:#7A1A13;--color-bg-default:#FFFFFF;--color-bg-subtle:#F7F8FA;--color-bg-sunken:#F1F2F5;--color-bg-inverse:#0E1120;--color-bg-inverse-hover:#262A3B;--color-bg-brand-soft:#EEF1FC;--color-bg-success-soft:#EEF7E6;--color-bg-warning-soft:#FFF6DD;--color-bg-danger-soft:#FDECEA;--color-border-default:#E6E8EE;--color-border-strong:#D3D6DE;--color-border-hover:#B9BDC8;--color-border-focus:#2736A6;--color-border-success:#BFE0A8;--color-border-warning:#F3D48A;--color-border-danger:#F2B8B1;--color-icon-subtle:#8A8F9C;--color-icon-brand:#2736A6;--color-icon-success:#3F9A2A;--color-icon-warning:#E3A008;--color-icon-danger:#D9442F;--color-scrim:rgba(14, 17, 32, 0.45);--shadow-focus:0 0 0 4px rgba(39, 54, 166, 0.14);--shadow-lift:0 12px 32px -12px rgba(30, 42, 110, 0.22);--shadow-popover:0 20px 48px -16px rgba(14, 17, 32, 0.28);--shadow-overlay:0 32px 80px -24px rgba(9, 14, 60, 0.45);--duration-fast:150ms;--duration-base:220ms;--duration-slow:420ms;--ease-out:cubic-bezier(0.2, 0.7, 0.2, 1);--radius-xs:2px;--radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:20px;--radius-2xl:24px;--radius-full:999px}
body{margin:0}
a{color:var(--color-text-link)}a:not([class]):hover{color:var(--color-text-link-hover)}
:focus-visible{outline:2px solid var(--color-border-focus);outline-offset:2px}
.j-btn{transition:background-color var(--duration-fast) var(--ease-out),border-color var(--duration-fast) var(--ease-out),color var(--duration-fast) var(--ease-out),box-shadow var(--duration-base) var(--ease-out),transform var(--duration-fast) var(--ease-out)}
.j-btn:active{transform:translateY(1px)}
.j-btn--primary{background:var(--color-bg-inverse);border:1px solid var(--color-bg-inverse);color:var(--color-text-inverse)}
.j-btn--primary:hover{background:var(--color-bg-inverse-hover);border-color:var(--color-bg-inverse-hover);color:var(--color-text-inverse);box-shadow:var(--shadow-lift)}
.j-btn--secondary{background:var(--color-bg-default);border:1px solid var(--color-border-strong);color:var(--color-text-default)}
.j-btn--secondary:hover{background:var(--color-bg-subtle);border-color:var(--color-text-default);color:var(--color-text-default)}
.j-btn--destructive{background:var(--color-text-danger);border:1px solid var(--color-text-danger);color:var(--color-text-inverse)}
.j-btn--destructive:hover{background:var(--color-text-danger-strong);border-color:var(--color-text-danger-strong)}
.j-btn--secondary-danger{background:var(--color-bg-default);border:1px solid var(--color-border-strong);color:var(--color-text-danger)}
.j-btn--secondary-danger:hover{background:var(--color-bg-danger-soft);border-color:var(--color-text-danger);color:var(--color-text-danger)}
.j-btn--link{background:transparent;border:none;color:var(--color-text-link);text-decoration:underline;text-decoration-color:rgba(39,54,166,.35);text-underline-offset:4px}
.j-btn--link:hover{color:var(--color-text-link-hover);text-decoration-color:currentColor}
.j-btn--danger{background:transparent;border:none;color:var(--color-text-danger);text-decoration:underline;text-decoration-color:rgba(163,35,26,.35);text-underline-offset:4px}
.j-btn--danger:hover{text-decoration-color:currentColor}
.j-btn[disabled]{cursor:not-allowed}
.j-chip{transition:background-color var(--duration-fast) var(--ease-out),border-color var(--duration-fast) var(--ease-out),color var(--duration-fast) var(--ease-out)}
.j-chip--off{background:var(--color-bg-default);border:1px solid var(--color-border-strong);color:var(--color-text-default)}
.j-chip--off:hover{border-color:var(--color-text-default)}
.j-chip--on{background:var(--color-bg-inverse);border:1px solid var(--color-bg-inverse);color:var(--color-text-inverse)}
.j-chip-dyn:hover{border-color:var(--color-text-default)!important}
.j-nav{transition:background-color var(--duration-fast) var(--ease-out),color var(--duration-fast) var(--ease-out)}
.j-nav:not([aria-current]):hover{background:var(--color-bg-subtle);color:var(--color-text-default)!important}
.j-lift{transition:transform var(--duration-base) var(--ease-out),box-shadow var(--duration-base) var(--ease-out),border-color var(--duration-base) var(--ease-out)}
.j-lift:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);border-color:var(--color-border-strong)!important}
.j-item{transition:background-color var(--duration-fast) var(--ease-out)}
.j-item[aria-pressed="false"]:hover{background:var(--color-bg-subtle)!important}
.j-row{transition:background-color var(--duration-fast) var(--ease-out)}
.j-row:hover{background:var(--color-bg-subtle)}
input,select,textarea{transition:border-color var(--duration-fast) var(--ease-out),box-shadow var(--duration-fast) var(--ease-out)}
input:hover,select:hover,textarea:hover{border-color:var(--color-border-hover)!important}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--color-border-focus)!important;box-shadow:var(--shadow-focus)}
.j-bar{transition:width var(--duration-slow) var(--ease-out)}
.j-pulse{animation:jpulse 2s var(--ease-out) infinite}
@keyframes jpulse{0%{box-shadow:0 0 0 0 rgba(63,154,42,.5)}70%,100%{box-shadow:0 0 0 7px rgba(63,154,42,0)} }
.j-in{animation:jin 260ms var(--ease-out)}
@keyframes jin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none} }
.j-spin{animation:jspin 700ms linear infinite}
@keyframes jspin{to{transform:rotate(360deg)} }
.j-pop{animation:jpop var(--duration-slow) var(--ease-out)}
@keyframes jpop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)} }
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none!important;animation:none!important} }

<script type="text/x-dc-template" id="dc-template">
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: #FFFFFF; color: #0E1120; font-family: Geist, Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.5"><main style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 16px"><header style="display: flex; align-items: center; gap: 12px; min-height: 44px"><a href="/celular/inicio" aria-label="Voltar para o início" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; box-sizing: border-box; border-radius: 50%; border: 1px solid #D3D6DE; background: #FFFFFF; color: #0E1120; cursor: pointer; flex: none; text-decoration: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 5.5 8 11l5.5 5.5"></path></svg></a><h1 style="margin: 0; flex: 1 1 auto; font-size: 20px; line-height: 1.3; font-weight: 600; letter-spacing: -0.01em">Meus lançamentos</h1><span style="display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 8px; background: #F1F2F5; color: #5E6372; font-family: 'Geist Mono', ui-monospace, SFMono-Regular, monospace; font-size: 12px; line-height: 1.2; letter-spacing: 0.06em; text-transform: uppercase"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 50%; background: #0D9488"></span>Turquesa</span></header><div style="display: flex; flex-direction: column; gap: 4px; padding: 16px; border-radius: 16px; background: #EEF7E6"><span style="font-size: 13px; line-height: 1.45; color: #2F6A12">Você já somou para a Turquesa</span><span style="display: flex; align-items: baseline; gap: 6px"><span style="line-height: 1; font-weight: 400; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; font-size: 48px; color: #0E1120">{{ aprovados }}</span><span style="font-size: 15px; line-height: 1.5; color: #5E6372">pts aprovados</span></span><span style="font-family: 'Geist Mono', ui-monospace, SFMono-Regular, monospace; font-size: 12px; line-height: 1.2; letter-spacing: 0.01em; text-transform: none; color: #2F6A12">{{ pendentesTexto }}</span></div><div role="group" aria-label="Filtrar por status" style="display: flex; gap: 6px; overflow-x: auto; margin: 0 -20px; padding: 0 20px"><sc-for list="{{ filtros }}" as="f" hint-placeholder-count="4"><button type="button" class="j-chip j-chip-dyn" aria-pressed="{{ f.ativo }}" onClick="{{ f.pick }}" style="flex: none; display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid {{ f.borda }}; background: {{ f.bg }}; color: {{ f.cor }}; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer; white-space: nowrap">{{ f.rot }}</button></sc-for></div><sc-if value="{{ temItens }}" hint-placeholder-val="{{ true }}"><section style="border-radius: 20px; border: 1px solid #E6E8EE; background: #FFFFFF; overflow: hidden"><ul style="list-style: none; margin: 0; padding: 0"><sc-for list="{{ itens }}" as="t" hint-placeholder-count="6"><li style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; border-top: 1px solid {{ t.borda }}"><div style="display: flex; align-items: center; gap: 12px"><span style="display: flex; flex-direction: column; flex: 1 1 auto; min-width: 0"><span style="font-size: 15px; line-height: 1.5; font-weight: 600">{{ t.titulo }}</span><span style="font-size: 13px; line-height: 1.45; color: #5E6372">{{ t.meta }}</span></span><span style="display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 8px; background: {{ t.tagBg }}; color: {{ t.tagCor }}; font-family: 'Geist Mono', ui-monospace, SFMono-Regular, monospace; font-size: 12px; line-height: 1.2; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 50%; background: {{ t.tagDot }}"></span>{{ t.tag }}</span></div><sc-if value="{{ t.recusado }}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: 12px; background: #FDECEA"><span style="font-size: 13px; line-height: 1.45; color: #7A1A13">{{ t.motivo }}</span><a href="/celular/enviar-de-novo" style="display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; min-height: 36px; color: #A3231A; font-weight: 600; text-decoration: none">Enviar de novo<svg aria-hidden="true" width="16" height="16" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11h12"></path><path d="M12.5 6.5 17 11l-4.5 4.5"></path></svg></a></div></sc-if></li></sc-for></ul></section></sc-if><sc-if value="{{ vazio }}" hint-placeholder-val="{{ false }}"><p style="margin: 0; padding: 24px 16px; border-radius: 16px; background: #F7F8FA; text-align: center; font-size: 13px; line-height: 1.45; color: #5E6372">Nenhum lançamento com esse status.</p></sc-if></main><footer style="flex: none; padding: 12px 20px 24px; border-top: 1px solid #E6E8EE"><a href="/celular/registrar" class="j-btn j-btn--primary" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 24px; box-sizing: border-box; border-radius: 999px; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer; white-space: nowrap; text-decoration-skip-ink: auto; width: 100%; text-decoration: none"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5v12"></path><path d="M5 11h12"></path></svg>Registrar ação</a></footer></div>
</script>
<script type="text/x-dc-logic" id="dc-logic">class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const filtro = st.filtro || 'todos';
const todos = [
{ acao: 'Tampinhas', det: '4,5 kg', quando: 'hoje, 14:32', pts: 45, st: 'pend' },
{ acao: 'Roupa infantil', det: '2 peças', quando: 'ontem, 09:10', pts: 30, st: 'ok' },
{ acao: 'Tampinhas', det: '1 kg', quando: '12 nov', pts: 10, st: 'no', motivo: 'A foto não mostra a balança.', quem: 'Bruno Farias' },
{ acao: 'Tampinhas', det: '6 kg', quando: '10 nov', pts: 60, st: 'ok' },
{ acao: 'Roupa infantil', det: '4 peças', quando: '8 nov', pts: 60, st: 'ok' },
{ acao: 'Atividade extra', det: '1 participação', quando: '5 nov', pts: 50, st: 'ok' }
];
const tag = { pend: ['Pendente', '#7A4E00', '#FFF6DD', '#E3A008'], ok: ['Aprovado', '#2F6A12', '#EEF7E6', '#3F9A2A'], no: ['Recusado', '#A3231A', '#FDECEA', '#D9442F'] };
const conta = (k) => todos.filter((t) => t.st === k).length;
const filtros = [{ id: 'todos', nome: 'Todos', n: todos.length }, { id: 'pend', nome: 'Pendentes', n: conta('pend') }, { id: 'ok', nome: 'Aprovados', n: conta('ok') }, { id: 'no', nome: 'Recusados', n: conta('no') }];
const lista = todos.filter((t) => filtro === 'todos' || t.st === filtro);
const aprov = todos.filter((t) => t.st === 'ok').reduce((s, t) => s + t.pts, 0);
const pend = todos.filter((t) => t.st === 'pend').reduce((s, t) => s + t.pts, 0);
return {
aprovados: aprov,
pendentesTexto: pend > 0 ? '+' + pend + ' pts aguardando aprovação' : 'nada aguardando aprovação',
filtros: filtros.map((f) => { const a = f.id === filtro; return { rot: f.nome + ' · ' + f.n, ativo: a, bg: a ? '#0E1120' : '#FFFFFF', cor: a ? '#FFFFFF' : '#0E1120', borda: a ? '#0E1120' : '#D3D6DE', pick: () => this.setState({ filtro: f.id }) }; }),
itens: lista.map((t, k) => ({
titulo: t.acao + ' · ' + t.det,
meta: t.quando + ' · ' + t.pts + ' pts',
tag: tag[t.st][0], tagCor: tag[t.st][1], tagBg: tag[t.st][2], tagDot: tag[t.st][3],
recusado: t.st === 'no',
motivo: t.motivo ? t.quem + ': “' + t.motivo + '”' : '',
borda: k === 0 ? 'transparent' : '#E6E8EE'
})),
vazio: lista.length === 0,
temItens: lista.length > 0
};
}
}
</script>
