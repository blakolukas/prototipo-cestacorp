<script type="text/x-dc-logic" id="dc-logic">class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const fmt = (n) => String(Math.round(n * 10) / 10).replace('.', ',');
const txt = st.qtdTxt != null ? st.qtdTxt : '1';
const num = parseFloat(String(txt).replace(',', '.'));
const valido = isFinite(num) && num > 0;
const qtd = valido ? num : 0;
const foto = !!st.foto;
const fase = st.fase || 'editando';
const enviando = fase === 'enviando';
const pontos = Math.round(qtd * 10);
const bloqueado = !foto || !valido || enviando;
let aviso = 'Mesma ação e mesmo líder. Só a foto precisa ser nova.';
if (enviando) { aviso = 'Enviando a foto…'; } else if (!valido) { aviso = 'Informe uma quantidade maior que zero.'; } else if (!foto) { aviso = 'Anexe uma foto nova para poder reenviar.'; }
return {
qtdTxt: txt,
digitar: (e) => this.setState({ qtdTxt: e.target.value }),
menos: () => this.setState({ qtdTxt: fmt(Math.max(0.5, (valido ? qtd : 0.5) - 0.5)) }),
mais: () => this.setState({ qtdTxt: fmt((valido ? qtd : 0) + 0.5) }),
semFoto: !foto, comFoto: foto,
anexarFoto: () => this.setState({ foto: !foto }),
pontosTexto: pontos + (pontos === 1 ? ' ponto' : ' pontos'),
contaTexto: valido ? fmt(qtd) + ' kg × 10 pts' : '',
bloqueado: bloqueado,
enviando: enviando,
enviar: () => { this.setState({ fase: 'enviando' }); setTimeout(() => this.setState({ fase: 'enviado' }), 900); },
enviarTexto: enviando ? 'Enviando…' : 'Reenviar para aprovação',
enviarBg: (bloqueado && !enviando) ? '#F1F2F5' : '#0E1120',
enviarCor: (bloqueado && !enviando) ? '#5E6372' : '#FFFFFF',
avisoTexto: aviso,
editando: fase !== 'enviado',
enviado: fase === 'enviado',
resumo: 'Tampinhas plásticas · ' + fmt(qtd) + ' kg · Equipe Turquesa'
};
}
}
