<script type="text/x-dc-logic" id="dc-logic">class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const fmt = (n) => String(Math.round(n * 10) / 10).replace('.', ',');
const base = [
{ id: 'marina', nome: 'Marina Souza', ini: 'MS', acao: 'Tampinhas plásticas', q: 4.5, un: ['kg', 'kg'], rate: 10, quando: 'hoje, 14:32', passo: 0.5 },
{ id: 'bianca', nome: 'Bianca Rocha', ini: 'BR', acao: 'Roupa infantil', q: 3, un: ['peça', 'peças'], rate: 15, quando: 'hoje, 09:48', passo: 1 },
{ id: 'joao', nome: 'João Pedro Reis', ini: 'JR', acao: 'Tampinhas plásticas', q: 1.5, un: ['kg', 'kg'], rate: 10, quando: 'ontem, 10:15', passo: 0.5 }
];
const aj = st.aj || {};
const itens = base.map((b) => { const q = aj[b.id] != null ? aj[b.id] : b.q; return Object.assign({}, b, { qq: q, pts: Math.round(q * b.rate), qtd: fmt(q) + ' ' + (q === 1 ? b.un[0] : b.un[1]), corr: aj[b.id] != null ? 'Corrigido de ' + fmt(b.q) + ' ' + (b.q === 1 ? b.un[0] : b.un[1]) : '' }); });
const fila = st.fila || itens.map((t) => t.id);
const pend = itens.filter((t) => fila.indexOf(t.id) !== -1);
const cur = pend[0] || null;
const feitos = itens.length - pend.length;
const cont = { ok: st.ok || 0, okPts: st.okPts || 0, no: st.no || 0 };
const decidir = (tipo, motivo) => {
if (!cur) { return; }
this.setState({ fila: fila.filter((id) => id !== cur.id), ultimo: { nome: cur.nome, pts: cur.pts, tipo: tipo, fila: fila, cont: cont }, recusando: false, motivo: '', corrigindo: false,
ok: cont.ok + (tipo === 'ok' ? 1 : 0), okPts: cont.okPts + (tipo === 'ok' ? cur.pts : 0), no: cont.no + (tipo === 'no' ? 1 : 0) });
};
const motivo = st.motivo || '';
const rapidos = ['A foto não mostra a balança', 'A quantidade não confere', 'A foto está ilegível', 'Não é desta edição'];
const qEdit = st.qEdit != null ? st.qEdit : (cur ? cur.qq : 0);
return {
restantes: pend.length === 1 ? '1 pendente' : pend.length + ' pendentes',
progresso: Math.round(feitos / itens.length * 100) + '%',
progTexto: feitos + ' de ' + itens.length,
temAtual: !!cur,
vazio: !cur,
c: cur ? { nome: cur.nome, ini: cur.ini, acao: cur.acao, qtd: cur.qtd, pts: cur.pts + ' pontos', conta: cur.qtd + ' × ' + cur.rate + ' pts por ' + cur.un[0], quando: cur.quando, foto: 'Foto enviada por ' + cur.nome.split(' ')[0], corr: cur.corr, temCorr: !!cur.corr } : {},
aprovar: () => decidir('ok'),
abrirRecusa: () => this.setState({ recusando: true, motivo: '' }),
fecharRecusa: () => this.setState({ recusando: false }),
recusando: !!st.recusando,
motivo: motivo,
digitarMotivo: (e) => this.setState({ motivo: e.target.value }),
rapidos: rapidos.map((r) => ({ txt: r, ativo: motivo === r, cls: motivo === r ? 'j-chip j-chip--on' : 'j-chip j-chip--off', pick: () => this.setState({ motivo: r }) })),
semMotivo: motivo.trim().length < 3,
recusaBg: motivo.trim().length < 3 ? '#F1F2F5' : '#A3231A',
recusaCor: motivo.trim().length < 3 ? '#5E6372' : '#FFFFFF',
confirmarRecusa: () => decidir('no', motivo),
corrigindo: !!st.corrigindo,
naoCorrigindo: !st.corrigindo,
abrirCorrecao: () => this.setState({ corrigindo: true, qEdit: cur ? cur.qq : 0 }),
qEditTxt: fmt(qEdit) + ' ' + (cur ? (qEdit === 1 ? cur.un[0] : cur.un[1]) : ''),
qPrevia: cur ? 'Fica ' + Math.round(qEdit * cur.rate) + ' pontos (antes ' + cur.pts + ')' : '',
menos: () => { if (cur) { this.setState({ qEdit: Math.max(cur.passo, qEdit - cur.passo) }); } },
mais: () => { if (cur) { this.setState({ qEdit: qEdit + cur.passo }); } },
salvarCorrecao: () => { if (cur) { this.setState({ corrigindo: false, aj: Object.assign({}, aj, { [cur.id]: qEdit }), qEdit: null }); } },
cancelarCorrecao: () => this.setState({ corrigindo: false, qEdit: null }),
temUltimo: !!st.ultimo,
ultimoTexto: st.ultimo ? (st.ultimo.tipo === 'ok' ? st.ultimo.nome.split(' ')[0] + ': +' + st.ultimo.pts + ' pts no placar' : st.ultimo.nome.split(' ')[0] + ': recusado') : '',
ultimoBg: st.ultimo && st.ultimo.tipo === 'no' ? '#FDECEA' : '#EEF7E6',
ultimoCor: st.ultimo && st.ultimo.tipo === 'no' ? '#A3231A' : '#2F6A12',
desfazer: () => { const u = st.ultimo; if (u) { this.setState({ fila: u.fila, ultimo: null, ok: u.cont.ok, okPts: u.cont.okPts, no: u.cont.no }); } },
fimTexto: 'Você aprovou ' + cont.ok + ' e ' + cont.okPts + ' pontos entraram para a Turquesa' + (cont.no ? '. Recusou ' + cont.no + '.' : '.')
};
}
}
</script>
