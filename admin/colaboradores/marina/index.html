<script type="text/x-dc-logic" id="dc-logic">class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const perfil = st.perfil || 'colab';
const equipe = st.equipe || 'Equipe Turquesa';
const perfis = [
{ id: 'colab', nome: 'Colaborador', desc: 'Registra ações e vê o placar.' },
{ id: 'lider', nome: 'Líder', desc: 'Também aprova e corrige os lançamentos da própria equipe.' },
{ id: 'admin', nome: 'Administradora', desc: 'Faz tudo, inclusive os cadastros.' }
];
const fase = st.fase || 'ativo';
return {
perfis: perfis.map((p) => {
const ativo = p.id === perfil;
return { nome: p.nome, desc: p.desc, ativo: ativo, bg: ativo ? '#FFFFFF' : '#F7F8FA', borda: ativo ? '#0E1120' : '#E6E8EE', ring: ativo ? '#0E1120' : '#8A8F9C', dot: ativo ? '#0E1120' : 'transparent', pick: () => this.setState({ perfil: p.id }) };
}),
equipe: equipe,
trocarEquipe: (e) => this.setState({ equipe: e.target.value }),
trocou: equipe !== 'Equipe Turquesa',
avisoEquipe: 'Os 200 pontos que Marina já somou ficam com a Turquesa. Daqui para frente ela pontua para a ' + equipe.replace('Equipe ', '') + '.',
virouLider: perfil === 'lider',
avisoLider: 'A Turquesa já tem Bruno Farias como líder. Marina passa a dividir a fila de aprovação com ele.',
ativo: fase === 'ativo',
desativado: fase === 'desativado',
confirmando: !!st.conf,
abrirDesativar: () => this.setState({ conf: true }),
fecharDesativar: () => this.setState({ conf: false }),
desativar: () => this.setState({ conf: false, fase: 'desativado' }),
reativar: () => this.setState({ fase: 'ativo' }),
salvo: !!st.salvo,
salvar: () => this.setState({ salvo: true }),
convite: () => this.setState({ convite: true }),
conviteEnviado: !!st.convite
};
}
}
