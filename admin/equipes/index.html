2px; height: 32px; border-radius: 50%; background: #FCE7F3; color: #9D174D; font-size: 12px; font-weight: 600; flex: none">SM</span><span style="display: flex; flex-direction: column; flex: 1 1 200px; min-width: 0"><span style="font-size: 15px; line-height: 1.5; font-weight: 600">Sofia Martins</span></span></li></ul></section></div><p style="margin: 0; font-size: 13px; line-height: 1.45; color: #5E6372">Os pontos são da equipe: quem troca de equipe passa a pontuar na nova, e o que já lançou fica na anterior.</p></main><sc-if value="{{ aberto }}" hint-placeholder-val="{{ false }}"><div style="position: fixed; inset: 0; z-index: 30; color: #0E1120; font-family: Geist, Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.5"><div aria-hidden="true" onClick="{{ fechar }}" style="position: absolute; inset: 0; background: rgba(14, 17, 32, 0.32)"></div><aside role="dialog" aria-modal="true" class="j-in" style="position: absolute; top: 0; right: 0; bottom: 0; width: min(480px, 100%); background: #FFFFFF; box-shadow: -24px 0 64px -24px rgba(9, 14, 60, 0.35); display: flex; flex-direction: column"><header style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 16px 16px 24px; border-bottom: 1px solid #E6E8EE"><h2 style="margin: 0; font-size: 20px; line-height: 1.3; font-weight: 600; letter-spacing: -0.01em">{{ tituloPainel }}</h2><button type="button" aria-label="Fechar" onClick="{{ fechar }}" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: none; border-radius: 50%; background: transparent; color: #0E1120; font-size: 24px; cursor: pointer">×</button></header><div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px"><div style="display: flex; flex-direction: column; gap: 6px"><label for="eq-nome" style="font-size: 13px; line-height: 1.45; font-weight: 600; color: #0E1120">Nome</label><input id="eq-nome" value="{{ nome }}" onChange="{{ digitarNome }}" placeholder="Ex.: Equipe Verde" style="height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid #D3D6DE; background: #FFFFFF; color: #0E1120; font-family: inherit; font-size: 15px; box-sizing: border-box; width: 100%"><sc-if value="{{ erroNome }}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; line-height: 1.45; color: #A3231A">Dê um nome com pelo menos 3 letras.</span></sc-if></div><div style="display: flex; flex-direction: column; gap: 8px"><span id="eq-cor" style="font-size: 13px; line-height: 1.45; font-weight: 600; color: #0E1120">Cor no placar</span><div role="radiogroup" aria-labelledby="eq-cor" style="display: flex; flex-wrap: wrap; gap: 12px"><sc-for list="{{ cores }}" as="c" hint-placeholder-count="6"><button type="button" role="radio" aria-checked="{{ c.sel }}" aria-disabled="{{ c.ocupada }}" aria-label="{{ c.rotulo }}" title="{{ c.rotulo }}" onClick="{{ c.pick }}" style="width: 36px; height: 36px; border-radius: 50%; border: none; background: {{ c.hex }}; opacity: {{ c.opac }}; box-shadow: {{ c.anel }}; cursor: pointer"></button></sc-for></div><span style="font-size: 13px; line-height: 1.45; color: #5E6372">Cores apagadas já estão em uso. A cor sempre aparece junto do nome.</span></div><sc-if value="{{ editando }}" hint-placeholder-val="{{ true }}"><div style="display: flex; flex-direction: column; gap: 8px"><span style="display: flex; justify-content: space-between"><span id="eq-lider" style="font-size: 13px; line-height: 1.45; font-weight: 600; color: #0E1120">Líder</span><span style="font-size: 13px; line-height: 1.45; color: #5E6372">{{ qtdMembros }}</span></span><div role="radiogroup" aria-labelledby="eq-lider" style="display: flex; flex-direction: column; gap: 4px"><sc-for list="{{ lideres }}" as="l" hint-placeholder-count="3"><button type="button" role="radio" aria-checked="{{ l.sel }}" onClick="{{ l.pick }}" class="j-item" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 8px; margin: 0 -8px; border: none; border-radius: 12px; background: transparent; color: #0E1120; font-family: inherit; font-size: 15px; text-align: left; cursor: pointer"><span aria-hidden="true" style="display: flex; align-items: center; justify-content: center; width: 18px; height: 18px; box-sizing: border-box; border-radius: 50%; border: 2px solid {{ l.ring }}"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{ l.dot }}"></span></span>{{ l.nome }}</button></sc-for></div><span style="font-size: 13px; line-height: 1.45; color: #5E6372">O líder aprova os lançamentos da equipe. Para mudar quem está na equipe, use o cadastro de cada colaborador.</span></div></sc-if><sc-if value="{{ novo }}" hint-placeholder-val="{{ false }}"><p style="margin: 0; padding: 14px 16px; border-radius: 12px; background: #F7F8FA; font-size: 13px; line-height: 1.45; color: #5E6372">A equipe nasce vazia. Depois de criar, adicione pessoas e escolha o líder pelo cadastro de colaborador.</p></sc-if></div><footer style="flex: none; display: flex; flex-wrap: wrap; gap: 8px; padding: 16px 24px 24px; border-top: 1px solid #E6E8EE"><button type="button" class="j-btn j-btn--primary" onClick="{{ salvar }}" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; box-sizing: border-box; border-radius: 999px; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer; white-space: nowrap; text-decoration: none">{{ salvarTexto }}</button><button type="button" class="j-btn j-btn--secondary" onClick="{{ fechar }}" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; box-sizing: border-box; border-radius: 999px; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer; white-space: nowrap; text-decoration: none">Cancelar</button></footer></aside></div></sc-if></div></div>
</script>
<script type="text/x-dc-logic" id="dc-logic">class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const equipes = {
azul: { nome: 'Equipe Azul', cor: 'azul', lider: 'Camila Duarte', membros: ['Camila Duarte', 'Rafael Lima', 'Carla Nunes'] },
laranja: { nome: 'Equipe Laranja', cor: 'laranja', lider: 'Paula Mendes', membros: ['Paula Mendes', 'Diego Alves', 'Fernanda Luz'] },
turquesa: { nome: 'Equipe Turquesa', cor: 'turquesa', lider: 'Bruno Farias', membros: ['Bruno Farias', 'Marina Souza', 'Bianca Rocha', 'João Pedro Reis'] },
vinho: { nome: 'Equipe Vinho', cor: 'vinho', lider: 'Letícia Prado', membros: ['Letícia Prado', 'Henrique Costa', 'Sofia Martins'] }
};
const cores = [
{ id: 'azul', nome: 'Azul', hex: '#2563EB' }, { id: 'laranja', nome: 'Laranja', hex: '#D97706' }, { id: 'turquesa', nome: 'Turquesa', hex: '#0D9488' },
{ id: 'vinho', nome: 'Vinho', hex: '#9D174D' }, { id: 'verde', nome: 'Verde', hex: '#16A34A' }, { id: 'roxo', nome: 'Roxo', hex: '#7C3AED' }
];
const painel = st.painel || null;
const novo = painel === 'nova';
const eq = novo ? { nome: '', cor: 'verde', lider: '', membros: [] } : (equipes[painel] || null);
const nome = st.nome != null ? st.nome : (eq ? eq.nome : '');
const cor = st.cor || (eq ? eq.cor : 'verde');
const lider = st.lider != null ? st.lider : (eq ? eq.lider : '');
const emUso = Object.keys(equipes).filter((k) => k !== painel).map((k) => equipes[k].cor);
const valido = nome.trim().length >= 3;
const abrir = (id) => () => this.setState({ painel: id, nome: null, cor: null, lider: null, tentou: false });
return {
aberto: !!painel,
tituloPainel: novo ? 'Nova equipe' : 'Editar ' + (eq ? eq.nome : ''),
editando: !novo,
novo: novo,
nome: nome,
digitarNome: (e) => this.setState({ nome: e.target.value }),
erroNome: !!st.tentou && !valido,
cores: cores.map((c) => {
const ocupada = emUso.indexOf(c.id) !== -1;
const sel = c.id === cor;
return { nome: c.nome, hex: c.hex, sel: sel, ocupada: ocupada, rotulo: c.nome + (ocupada ? ' (em uso)' : ''), anel: sel ? '0 0 0 2px #FFFFFF, 0 0 0 4px #0E1120' : 'none', opac: ocupada ? '0.3' : '1', pick: () => { if (!ocupada) { this.setState({ cor: c.id }); } } };
}),
lideres: (eq ? eq.membros : []).map((m) => ({ nome: m, sel: m === lider, ring: m === lider ? '#0E1120' : '#8A8F9C', dot: m === lider ? '#0E1120' : 'transparent', pick: () => this.setState({ lider: m }) })),
temMembros: !!eq && eq.membros.length > 0,
semMembros: !eq || eq.membros.length === 0,
qtdMembros: eq ? eq.membros.length + ' pessoas' : '',
abrirNova: abrir('nova'), editarAzul: abrir('azul'), editarLaranja: abrir('laranja'), editarTurquesa: abrir('turquesa'), editarVinho: abrir('vinho'),
fechar: () => this.setState({ painel: null }),
salvar: () => { if (!valido) { this.setState({ tentou: true }); return; } this.setState({ painel: null, toast: novo ? nome.trim() + ' criada. Agora adicione pessoas pelo cadastro de colaborador.' : nome.trim() + ' atualizada.' }); },
salvarTexto: novo ? 'Criar equipe' : 'Salvar alterações',
temToast: !!st.toast,
toast: st.toast || '',
fecharToast: () => this.setState({ toast: null })
};
}
}
</script>
