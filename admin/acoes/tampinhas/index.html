<script type="text/x-dc-logic" id="dc-logic">class Component extends DCLogic {

const st = this.state || {};
const tipo = st.tipo || 'kg';
const pts = st.pts != null ? st.pts : '10';
const n = parseInt(pts, 10);
const ok = isFinite(n) && n > 0;
const mudou = ok && (n !== 10 || tipo !== 'kg');
const tipos = [{ id: 'kg', nome: 'Por kg' }, { id: 'item', nome: 'Por item' }, { id: 'fixa', nome: 'Pontos fixos' }];
let rotulo = 'Pontos por kg';
let exemplo = ok ? 'Exemplo: 4,5 kg valem ' + Math.round(4.5 * n) + ' pontos.' : 'Informe um número maior que zero.';
if (tipo === 'item') { rotulo = 'Pontos por item'; if (ok) { exemplo = 'Exemplo: 3 itens valem ' + (3 * n) + ' pontos.'; } }
if (tipo === 'fixa') { rotulo = 'Pontos por participação'; if (ok) { exemplo = 'Cada participação vale ' + n + ' pontos, sem quantidade.'; } }
const fase = st.fase || 'editando';
return {
tipos: tipos.map((t) => {
const ativo = t.id === tipo;
return { nome: t.nome, ativo: ativo, bg: ativo ? '#FFFFFF' : 'transparent', cor: ativo ? '#0E1120' : '#5E6372', sombra: ativo ? '0 1px 3px rgba(14, 17, 32, 0.14)' : 'none', pick: () => this.setState({ tipo: t.id }) };
}),
rotuloPontos: rotulo,
pts: pts,
digitarPts: (e) => this.setState({ pts: e.target.value }),
exemplo: exemplo,
exBg: ok ? '#EEF7E6' : '#FDECEA',
exCor: ok ? '#2F6A12' : '#A3231A',
mudou: mudou,
impacto: 'A partir de 18 nov, 4,5 kg passam de 45 para ' + (tipo === 'fixa' ? n : Math.round(4.5 * n)) + ' pontos. Os 184 kg já aprovados continuam com 10 pts por kg.',
salvar: () => this.setState({ fase: 'salvo' }),
salvarBg: mudou ? '#0E1120' : '#F1F2F5',
salvarCor: mudou ? '#FFFFFF' : '#5E6372',
bloqueado: !mudou,
salvo: fase === 'salvo',
editando: fase !== 'salvo',
desfazer: () => this.setState({ fase: 'editando', pts: '10', tipo: 'kg' }),
confirmandoDes: !!st.confDes,
abrirDesativar: () => this.setState({ confDes: true }),
fecharDesativar: () => this.setState({ confDes: false }),
desativar: () => this.setState({ confDes: false, desativada: true }),
reativar: () => this.setState({ desativada: false }),
desativada: !!st.desativada,
confirmaTexto: 'Regra nova salva: ' + n + (tipo === 'kg' ? ' pts por kg' : tipo === 'item' ? ' pts por item' : ' pts fixos') + ' a partir de 18 nov.'
};
}
}
</script>
