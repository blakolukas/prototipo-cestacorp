const linhas = (itens.placar ? 4 : 0) + (itens.aprovados ? (periodo === 'edicao' ? 248 : 41) : 0) + (itens.outros ? (periodo === 'edicao' ? 23 : 6) : 0) + (itens.auditoria ? (periodo === 'edicao' ? 312 : 58) : 0);
const algum = Object.keys(itens).some((k) => itens[k]);
const nomes = { xlsx: 'Planilha (.xlsx)', csv: 'CSV', pdf: 'PDF para imprimir' };
const ext = { xlsx: 'xlsx', csv: 'zip', pdf: 'pdf' };
const op = (lista, atual, chave) => lista.map((o) => { const a = o.id === atual; return { nome: o.nome, desc: o.desc || '', ativo: a, bg: a ? '#FFFFFF' : 'transparent', cor: a ? '#0E1120' : '#5E6372', sombra: a ? '0 1px 3px rgba(14, 17, 32, 0.14)' : 'none', ring: a ? '#0E1120' : '#8A8F9C', dot: a ? '#0E1120' : 'transparent', borda: a ? '#0E1120' : '#E6E8EE', pick: () => this.setState({ [chave]: o.id, fase: 'escolhendo' }) }; });
const gerando = fase === 'gerando';
return {
aberto: aberto,
fechado: !aberto,
abrir: () => this.setState({ aberto: true, fase: 'escolhendo' }),
fechar: () => this.setState({ aberto: false }),
periodos: op([{ id: 'edicao', nome: 'Edição inteira', desc: '[Data de início] até hoje' }, { id: 'semana', nome: 'Últimos 7 dias', desc: '10 a 17 nov' }], periodo, 'periodo'),
formatos: op([{ id: 'xlsx', nome: 'Planilha' }, { id: 'csv', nome: 'CSV' }, { id: 'pdf', nome: 'PDF' }], formato, 'formato'),
conteudo: [
{ id: 'placar', nome: 'Placar por equipe', desc: 'Posição, pontos por ação e total' },
{ id: 'aprovados', nome: 'Lançamentos aprovados', desc: 'Quem, o quê, quantidade, pontos e data' },
{ id: 'outros', nome: 'Pendentes e recusados', desc: 'Com o motivo de cada recusa' },
{ id: 'auditoria', nome: 'Histórico de auditoria', desc: 'Todas as alterações, com autor e horário' }
].map((c) => ({ nome: c.nome, desc: c.desc, marcado: !!itens[c.id], bg: itens[c.id] ? '#0E1120' : '#FFFFFF', borda: itens[c.id] ? '#0E1120' : '#D3D6DE', marca: itens[c.id] ? '✓' : '', alternar: () => this.setState({ itens: Object.assign({}, itens, { [c.id]: !itens[c.id] }), fase: 'escolhendo' }) })),
resumo: algum ? 'Cerca de ' + linhas + ' linhas · ' + nomes[formato] : 'Escolha pelo menos um conteúdo.',
bloqueado: !algum || gerando,
gerando: gerando,
baixar: () => { this.setState({ fase: 'gerando' }); setTimeout(() => this.setState({ fase: 'pronto' }), 1200); },
botaoTexto: gerando ? 'Gerando relatório…' : 'Baixar relatório',
botaoBg: (!algum && !gerando) ? '#F1F2F5' : '#0E1120',
botaoCor: (!algum && !gerando) ? '#5E6372' : '#FFFFFF',
escolhendo: fase !== 'pronto',
pronto: fase === 'pronto',
arquivo: 'gincana-2026-' + (periodo === 'edicao' ? 'edicao' : '7-dias') + '.' + ext[formato],
tamanho: Math.max(12, Math.round(linhas * 0.18)) + ' KB'
};
}
}
