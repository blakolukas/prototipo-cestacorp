input:focus,select:focus,textarea:focus{outline:none;border-color:var(--color-border-focus)!important;box-shadow:var(--shadow-focus)}

@keyframes jpulse{0%{box-shadow:0 0 0 0 rgba(63,154,42,.5)}70%,100%{box-shadow:0 0 0 7px rgba(63,154,42,0)} }

<div style="min-height: 100vh; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(480px, 100%), 1fr)); background: #FFFFFF; color: #0E1120; font-family: Geist, Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.5"><div style="min-height: 100vh; box-sizing: border-box; padding: 48px 24px 40px; display: flex; flex-direction: column; align-items: center; background: #FFFFFF"><div style="display: flex; align-items: center; gap: 10px; line-height: 1.5; font-weight: 600; font-size: 17px"><img src="/assets/cestacorp-mark.png" alt="" style="display: block; width: 32px; height: 32px; flex: none">Gincana Solidária</div><div style="flex: 1 1 auto; width: 100%; max-width: 380px; display: flex; flex-direction: column; justify-content: center; gap: 32px; padding: 48px 0"><div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center"><h1 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-size: 48px; line-height: 1.05; font-weight: 400; letter-spacing: -0.01em; text-wrap: balance">Acesse sua conta</h1><p style="margin: 0; font-size: 15px; line-height: 1.5; color: #5E6372">Entre com o e-mail da empresa para registrar e acompanhar o placar.</p></div><div style="display: flex; flex-direction: column; gap: 16px"><div style="display: flex; flex-direction: column; gap: 6px"><label for="email" style="font-size: 13px; line-height: 1.45; font-weight: 600; color: #0E1120">E-mail</label><input id="email" type="email" autocomplete="username" placeholder="voce@empresa.com.br" value="{{ email }}" onChange="{{ digitarEmail }}" aria-invalid="{{ erroEmail }}" aria-describedby="email-erro" style="height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid {{ bordaEmail }}; background: #FFFFFF; color: #0E1120; font-family: inherit; font-size: 15px; box-sizing: border-box; width: 100%"><sc-if value="{{ erroEmail }}" hint-placeholder-val="{{ false }}"><span id="email-erro" style="font-size: 13px; line-height: 1.45; color: #A3231A">Use o e-mail completo, por exemplo voce@empresa.com.br.</span></sc-if></div><div style="display: flex; flex-direction: column; gap: 6px"><label for="senha" style="font-size: 13px; line-height: 1.45; font-weight: 600; color: #0E1120">Senha</label><input id="senha" type="password" autocomplete="current-password" value="{{ senha }}" onChange="{{ digitarSenha }}" aria-invalid="{{ erroSenha }}" aria-describedby="senha-erro" style="height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid {{ bordaSenha }}; background: #FFFFFF; color: #0E1120; font-family: inherit; font-size: 15px; box-sizing: border-box; width: 100%"><sc-if value="{{ erroSenha }}" hint-placeholder-val="{{ false }}"><span id="senha-erro" style="font-size: 13px; line-height: 1.45; color: #A3231A">Digite sua senha.</span></sc-if></div><div style="display: flex; flex-direction: column; gap: 8px; padding-top: 4px"><sc-if value="{{ erroGeral }}" hint-placeholder-val="{{ false }}"><div role="alert" class="j-in" style="padding: 12px 14px; border-radius: 12px; background: #FDECEA; color: #7A1A13; font-size: 13px; line-height: 1.45">{{ erroTexto }}</div></sc-if><sc-if value="{{ bloqueado }}" hint-placeholder-val="{{ false }}"><div role="alert" class="j-in" style="display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 12px; background: #FDECEA; color: #7A1A13; font-size: 13px; line-height: 1.45"><strong>Acesso bloqueado por 5 minutos.</strong><span>Foram 5 tentativas erradas. Espere ou crie uma senha nova agora.</span><a href="/esqueci-senha" style="color: #A3231A; font-weight: 600">Redefinir a senha</a></div></sc-if><button type="button" class="j-btn" disabled="{{ desabilitado }}" aria-busy="{{ conferindo }}" onClick="{{ entrar }}" style="display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 52px; padding: 0 24px; border: none; border-radius: 999px; background: {{ botaoBg }}; color: {{ botaoCor }}; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer"><sc-if value="{{ conferindo }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" class="j-spin" style="width: 16px; height: 16px; box-sizing: border-box; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.35); border-top-color: #FFFFFF"></span></sc-if>{{ botaoTexto }}</button><a id="ir-placar" href="/admin/placar" tabindex="-1" aria-hidden="true" style="display: none">placar</a><div style="display: flex; justify-content: center"><a href="/esqueci-senha" class="j-btn j-btn--link" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0; box-sizing: border-box; border-radius: 999px; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer; white-space: nowrap; text-decoration-skip-ink: auto">Esqueci minha senha</a></div></div></div></div><p style="margin: 0; max-width: 420px; text-align: center; font-size: 13px; line-height: 1.45; color: #5E6372">Primeiro acesso? <a href="/primeiro-acesso">Use o convite</a> que chegou no seu e-mail para criar a senha. A Gincana Solidária é uma ação da Cestacorp.</p></div><div class="j-hero" style="position: relative; min-height: 100vh; overflow: hidden; background: #0E2111; height: 794px"><img src="/assets/trofeu-mesa.jpg" alt="Troféu da Gincana Solidária: duas figuras erguendo um coração com a marca da Cestacorp, sobre uma mesa de madeira" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; display: block"></div></div>

<script type="text/x-dc-logic" id="dc-logic">class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const email = st.email || '';
const senha = st.senha || '';
const fase = st.fase || 'editando';
const tent = st.tent || 0;
const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim());
const bloqueado = tent >= 5;
const conferindo = fase === 'conferindo' || fase === 'ok';
const erroEmail = !!st.tentou && !emailOk;
const erroSenha = !!st.tentou && senha === '';
const restam = 5 - tent;
return {
email: email,
senha: senha,
digitarEmail: (e) => this.setState({ email: e.target.value }),
digitarSenha: (e) => this.setState({ senha: e.target.value }),
erroEmail: erroEmail,
erroSenha: erroSenha,
bordaEmail: erroEmail ? '#D9442F' : '#D3D6DE',
bordaSenha: erroSenha ? '#D9442F' : '#D3D6DE',
erroGeral: fase === 'erro' && !bloqueado,
erroTexto: 'E-mail ou senha não conferem. ' + (restam === 1 ? 'Resta 1 tentativa.' : 'Restam ' + restam + ' tentativas.'),
bloqueado: bloqueado,
conferindo: conferindo,
desabilitado: conferindo || bloqueado,
botaoTexto: fase === 'ok' ? 'Entrando…' : (conferindo ? 'Conferindo…' : 'Entrar'),
botaoBg: bloqueado ? '#F1F2F5' : '#0E1120',
botaoCor: bloqueado ? '#5E6372' : '#FFFFFF',
entrar: () => {
if (bloqueado || conferindo) { return; }
if (!emailOk || senha === '') { this.setState({ tentou: true }); return; }
this.setState({ fase: 'conferindo', tentou: false });
setTimeout(() => {
if (senha.length >= 8) {
this.setState({ fase: 'ok' });
setTimeout(() => { const a = document.getElementById('ir-placar'); if (a) { a.click(); } }, 300);
} else {
this.setState({ fase: 'erro', tent: tent + 1, senha: '' });
}
}, 900);
}
};
}
}
</script>
